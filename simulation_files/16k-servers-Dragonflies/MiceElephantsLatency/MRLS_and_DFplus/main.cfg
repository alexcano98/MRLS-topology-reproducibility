Configuration
{
	random_seed: ![42,935,128643],
	warmup: 20000,
	measured: 50000,
	statistics_packet_definitions: [[[=roundto{value:delay, precision: 2}], [=delay]] ],
	general_frequency_divisor:2, //makes one cycle of the network each two cycles of the base clock. Used for router speedup
	topology: topologia ![
        MultiStage
        {
            stages:[
                ExplicitStageFile{
                    filename: "../../MRLS_1280_19_760_32_a_net",
                },
            ],
            servers_per_leaf: 13,
            legend_name: "imported MRLS cost 1.46",
        }, //16640 radix 32
		Megafly{
			global_ports_per_spine: 16,
			servers_per_leaf: 16,
			global_arrangement: Palmtree,
			group_size: 16,
			number_of_groups: 65,
			legend_name: "Dragonfly+"
		},//16640 radix 32 trunking 4
	],
	traffic: ![
		SyntheticTrafficDistribution { //flit size is 128 bits (16 bytes)
			tasks: 16640,
			// Sweep load to find saturation point (e.g., 0.1 to 0.9)
			load: ![0.1, 0.25], //In reality is 0.2 and 0.5

			// Hotspot Pattern: 50% of traffic goes to nodes 0-3, rest is uniform.
			pattern: Uniform,

			// Bimodal Size Distribution:
			// 80% small control messages (1 phit), 20% large data packets (16 phits)
			message_size: Multimodal {
			    sizes:   [16,   256],
			    weights: [0.9, 0.1]
			},
			legend_name: "Mice and elephant flows"
		},
	],

	maximum_packet_size: 16,
	router: InputOutput
	{
		virtual_channels: 4,// topologia![4, 4],
		//Choose randomly among the legal choices for each request.
		virtual_channel_policies: topologia![
			[
					MapHop { hop_to_policy: [ // This recieves a list with the VC allowed at each hop. Each Up-Down phase of a leaf-spine network use the same VCs as its deadlock-free
							ArgumentVC{allowed:[0]},
							ArgumentVC{allowed:[0]}, //VC 0 is used for first Up-Down phase (2 hops)
							ArgumentVC{allowed:[1]},
							ArgumentVC{allowed:[1]}, //VC 1 is used for second Up-Down phase (2 hops)
							ArgumentVC{allowed:[2]},
							ArgumentVC{allowed:[2]}, //VC 2 is used for second Up-Down phase (2 hops)
							ArgumentVC{allowed:[3]},
							ArgumentVC{allowed:[3]},
						],
					},
					VecLabel{label_vector:[0,64,80]}, //Add penalties of 64 flits to non-minimal paths, or 0 if its a minimal path
					OccupancyFunction{label_coefficient:1, occupancy_coefficient:1, product_coefficient:0, constant_coefficient:0, use_internal_space:true,use_neighbour_space:true, aggregate:true},
					OccupancyFunction{label_coefficient:1, occupancy_coefficient:1, product_coefficient:0, constant_coefficient:0, use_internal_space:true,use_neighbour_space:true, aggregate:false},
					LowestLabel, EnforceFlowControl, Random,
			],

			[

				MapHop
				{

					hop_to_policy: [
						MapLabel //0
						{
							label_to_policy:[
								Chain{
									policies:[
										OccupancyFunction{label_coefficient:0, occupancy_coefficient:1, product_coefficient:0, constant_coefficient:0, use_internal_space:true,use_neighbour_space:true, aggregate:false},
									],
								}, //0

								Chain{
									policies:[
										AverageOccupancyFunction{label_coefficient:0, occupancy_coefficient:2, product_coefficient:0, constant_coefficient:16, use_internal_space:true,use_neighbour_space:true, exclude_minimal_ports: false, virtual_channels: [0], },
									],
								},//1
							],

						},
						MapLabel //1
						{
							label_to_policy:[
								Chain{
									policies:[
										OccupancyFunction{label_coefficient:0, occupancy_coefficient:1, product_coefficient:0, constant_coefficient:0, use_internal_space:true,use_neighbour_space:true, aggregate:false},
									],
								}, //0

								Chain{
									policies:[
										AverageOccupancyFunction{label_coefficient:0, occupancy_coefficient:3, product_coefficient:0, constant_coefficient:16, use_internal_space:true,use_neighbour_space:true, exclude_minimal_ports: false, virtual_channels: [0], exclude_link_classes:[0]},
									],
								},//1
							],

						},

					],
					above_policy:MapLabel
					{
						label_to_policy:[
								Chain{
									policies:[
										OccupancyFunction{label_coefficient:0, occupancy_coefficient:1, product_coefficient:0, constant_coefficient:0, use_internal_space:true,use_neighbour_space:true, aggregate:false},
									],
								}, //0

								Chain{
									policies:[
										OccupancyFunction{label_coefficient:0, occupancy_coefficient:1, product_coefficient:0, constant_coefficient:48, use_internal_space:true,use_neighbour_space:true, aggregate:false},
									],
								},//1
						],

					},
				},

				LowestLabel, EnforceFlowControl, Random
			],
		],
		allocator:Random, //Allocator, es necesario ponerlo
		buffer_size: 128,//phits per buffer
		bubble: false,
		flit_size: 16,//phits in each packet. If equal to packet_size then it is virtual cut-through
		intransit_priority: false,
		allow_request_busy_port: true,
		output_buffer_size:64,
		crossbar_frequency_divisor: 1, //Crossbar clock goes each cycle of the base clock. It goes two times faster than the links and other components of the network. This is how router speedup is implemented
		crossbar_delay: 2, //There is a delay of 2 base clock cycles to go through the crossbar
	},
	routing: topologia![
		Polarized{
			include_labels:true,
			strong:false,
			legend_name: "Polarized",
		},

		MegaflyAD{
			first_allowed_virtual_channels: [0, 1], //Use VCs 0 and 1 in parallel to avoid HoL blocking
			second_allowed_virtual_channels: [2, 3], //Use VCs 2 and 3 in parallel to avoid HoL blocking
			minimal_to_deroute: [1, 1, 0],
			source_group_pattern:[
				[None, None], //up
				[None, None], //down
			],
			intermediate_group_pattern:[
				[None, None], //up
				[None, None], //down
			],
			destination_group_pattern:[
				[None, None], //up
				[None, None], //down
			],
			global_pattern_per_hop:[
				[None, None],
				[None, None]
			],
			legend_name: "FPAR 2 vc",
		},
	],
	link_classes: [
		LinkClass
		{
			delay: 2,
			//frequency_divisor: 1,//optionally set how many base cycles make out a link cycle of this class.
