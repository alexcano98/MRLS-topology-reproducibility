Configuration
{
	random_seed: ![42,935,128643],
	warmup: 20000,
	measured: 50000,
	general_frequency_divisor:2, //makes one cycle of the network each two cycles of the base clock. Used for router speedup
	statistics_packet_definitions: [[[=roundto{value:delay, precision: 2}], [=delay]] ],
	topology: topologia ![
		Dragonfly{
			global_ports_per_router: 8,
			servers_per_router: 8,
			global_arrangement: Palmtree,
			group_size: 16,
			number_of_groups: 129,
			legend_name: "Dragonfly"
		}, //16512 radix 32
	],
	traffic: ![
		SyntheticTrafficDistribution {
			tasks: 16512,
			// 0.5 of offered load respecting to the link (the general_frequency_divisor parameter is 2)
			load: ![0.1, 0.25], //In reality is 0.2 and 0.5

			// Uniform destination of the messages
			pattern: Uniform,

			// Bimodal Size Distribution:
			// 90% small control messages (16 flits), 10% large messages (256 flits)
			message_size: Multimodal {
			    sizes:   [16,   256],
			    weights: [0.9, 0.1]
			},
			legend_name: "Mice and elephant flows"
		},
	],

	maximum_packet_size: 16,
	router: InputOutput
	{
		virtual_channels: topologia![4,],
		//Choose randomly among the legal choices for each request.
		virtual_channel_policies: topologia![

			//minFirst ugal
			[


				MapLabel
				{
					label_to_policy:[
							Chain{
								policies:[
									OccupancyFunction{label_coefficient:0, occupancy_coefficient:1, product_coefficient:0, constant_coefficient:0, use_internal_space:true,use_neighbour_space:true, aggregate:false},
								],
							}, //0

							Chain{
								policies:[
									AverageOccupancyFunction{label_coefficient:0, occupancy_coefficient:2, product_coefficient:0, constant_coefficient:16, use_internal_space:true,use_neighbour_space:true, exclude_minimal_ports: true, virtual_channels: [0], },
								],
							},//1
					],

				},


				LowestLabel, EnforceFlowControl, Random
			],

		],
		allocator:Random, //Allocator, es necesario ponerlo
		buffer_size: 128,//phits per buffer
		bubble: false,
		flit_size: 16,//phits in each packet. If equal to packet_size then it is virtual cut-through
		intransit_priority: false,
		allow_request_busy_port: true,
		output_buffer_size:64,
		crossbar_frequency_divisor: 1, //Crossbar clock goes each cycle of the base clock. It goes two times faster than the links and other components of the network. This is how router speedup is implemented
		crossbar_delay: 2, //There is a delay of 2 base clock cycles to go through the crossbar
	},
	routing: topologia![
			Sum{
				policy: TryBoth,
				first_routing: ChannelMap{ routing:AscendantChannelsWithLinkClass{routing:WeighedShortest { class_weight: [1,100] }, bases:[1,1]}, map:[[0],[1],] },
				second_routing:
					Valiant4Dragonfly{
                        first: ChannelMap{ routing:AscendantChannelsWithLinkClass{routing:WeighedShortest { class_weight: [1,100] }, bases:[1,1]}, map:[[0],[1],] },
                        second: ChannelMap { routing:AscendantChannelsWithLinkClass{routing:WeighedShortest { class_weight: [1,100] }, bases:[1,1]}, map:[[2],[3]] },
				},
				first_allowed_virtual_channels:[0,1,2,3],
				second_allowed_virtual_channels:[0,1,2,3],
				second_extra_label: 1,
				legend_name: "Ugal",
			},
	],
	link_classes: [
		LinkClass
		{
			delay: 2,
			//frequency_divisor: 1,//optionally set how many base cycles make out a link cycle of this class.
		},
		LinkClass
		{
			delay: 2,
			//frequency_divisor: 1,//optionally set how many base cycles make out a link cycle of this class.
		},
		LinkClass
		{
			delay: 2,
			//frequency_divisor: 1,//optionally set how many base cycles make out a link cycle of this class.
		},
	],
	launch_configurations: [
		Slurm
		{
			job_pack_size: 1,
			time: "3-00:00:00",
		}
	]
}
