Configuration
{
	random_seed: ![42,935,128643],
	warmup: 20000,
	measured: 50000,
	general_frequency_divisor:2, //makes one cycle of the network each two cycles of the base clock. Used for router speedup
	statistics_packet_definitions: [[[=roundto{value:delay, precision: 2}], [=delay]] ],
	topology: ![
		MultiStage
		{
			stages:[
				ExplicitStageFile{
					filename: "../../MRLS_614_18_307_36",
				},
			],
			servers_per_leaf: 18,
			legend_name: "MRLS cost 1",
		},
		OFT
		{
			height: 1, 
			prime: 17,
			servers_per_leaf: 18,
			legend_name: "OFT q 17",
		},
	],
	traffic: ![
		SyntheticTrafficDistribution { //flit size is 128 bits (16 bytes)
			tasks: 11052,
			// Sweep load to find saturation point (e.g., 0.1 to 0.9)
			load: ![0.25],
			
			// Hotspot Pattern: 50% of traffic goes to nodes 0-3, rest is uniform.
			pattern: Uniform,
			
			// Bimodal Size Distribution:
			// 80% small control messages (1 phit), 20% large data packets (16 phits)
			message_size: Multimodal {
			    sizes:   [16,   256],
			    weights: [0.9, 0.1]
			},	
			legend_name: "Uniform"
		},
	],
	maximum_packet_size: 16,
	router: InputOutput
	{
		virtual_channels: 4,
		//Choose randomly among the legal choices for each request.
		virtual_channel_policies: [ 
				MapHop { hop_to_policy: [ // This recieves a list with the VC allowed at each hop. Each Up-Down phase of a leaf-spine network use the same VCs as its deadlock-free
						ArgumentVC{allowed:[0]},   
						ArgumentVC{allowed:[0]}, //VC 0 for first Up-Down phase
						ArgumentVC{allowed:[1]},
						ArgumentVC{allowed:[1]}, //VC 1 for second Up-Down phase
						ArgumentVC{allowed:[2]},
						ArgumentVC{allowed:[2]}, //VC 2 for third Up-Down phase
						ArgumentVC{allowed:[3]},    
						ArgumentVC{allowed:[3]},    
					],
				}, 
				VecLabel{label_vector:[0,64,80]}, //Add penalties of 64 flits to non-minimal paths, or 0 if its a minimal path
				OccupancyFunction{label_coefficient:1, occupancy_coefficient:1, product_coefficient:0, constant_coefficient:0, use_internal_space:true,use_neighbour_space:true, aggregate:true},
				OccupancyFunction{label_coefficient:1, occupancy_coefficient:1, product_coefficient:0, constant_coefficient:0, use_internal_space:true,use_neighbour_space:true, aggregate:false},
				LowestLabel, EnforceFlowControl, Random,
		],
		allocator:Random, //Allocator, es necesario ponerlo
		buffer_size: 128,//phits per buffer
		bubble: false,
		flit_size: 16,//phits in each packet. If equal to packet_size then it is virtual cut-through
		intransit_priority: false,
		allow_request_busy_port: true,
		output_buffer_size:64,
		crossbar_frequency_divisor: 1, //Crossbar clock goes each cycle of the base clock. It goes two times faster than the links and other components of the network. This is how router speedup is implemented
		crossbar_delay: 2, //There is a delay of 2 base clock cycles to go through the crossbar
	},
	routing: ![
		Polarized{
			include_labels:true,
			strong:false, 
			legend_name: "Polarized",
		},
	],
	link_classes: [
		LinkClass
		{
			delay: 2,
			//frequency_divisor: 1,//optionally set how many base cycles make out a link cycle of this class.
		},
		LinkClass
		{
			delay: 2,
			//frequency_divisor: 1,//optionally set how many base cycles make out a link cycle of this class.
		},
	],
	launch_configurations: [
		Slurm
		{
			job_pack_size: 1,
			time: "3-00:00:00",
		}
	]
}
